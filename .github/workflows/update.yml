name: "@meowmeres 🏳️WHITE LISTS🏳️"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # DOWNLOAD
      # =========================
      - name: Download sources
        run: |
          set -e

          curl -fLsS \
          https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-checked.txt \
          -o all.txt

      # =========================
      # BUILD
      # =========================
      - name: Build VPN list
        run: |
          set -e
          export TZ=Europe/Moscow

          mkdir -p public

          # =========================
          # INPUT CHECK
          # =========================
          if [ ! -s all.txt ]; then
            echo "NO INPUT DATA" > public/white-list.txt
            exit 0
          fi

          tr -d '\r' < all.txt > fixed.txt

          # =========================
          # EXTRACT LINKS
          # =========================
          grep -aEo '(vless|trojan|ss)://[^[:space:]]+' fixed.txt > raw.txt || true

          if [ ! -s raw.txt ]; then
            echo "NO LINKS FOUND" > public/white-list.txt
            exit 0
          fi

          # =========================
          # SIMPLE DEDUP
          # =========================
          awk '!seen[$0]++' raw.txt > final.txt

          # =========================
          # OUTPUT
          # =========================
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < final.txt)

          {
            echo "# profile-title: @meowmeres 🏳️WHITE LISTS🏳️"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT"
            echo ""
            cat final.txt
          } > public/white-list.txt

          cp final.txt public/android.txt

      # =========================
      # DEPLOY
      # =========================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
