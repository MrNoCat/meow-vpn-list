name: "@meowmeres 🏳️HYSTERIA LISTS🏳️"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write
  contents: read

env:
  CONFIG_URL: "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
  MAX_SERVERS: 5
  RUSSIA_SERVERS: 3
  OTHER_SERVERS: 2
  TIMEOUT: 5
  PARALLEL_CHECKS: 10

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel jq netcat-openbsd
          echo "TZ=Europe/Moscow" >> $GITHUB_ENV

      - name: Download and validate config
        id: download
        run: |
          set -e
          mkdir -p public
          
          if ! curl -fLsS --connect-timeout 10 --max-time 30 \
            "${{ env.CONFIG_URL }}" -o all.txt; then
            echo "status=error" >> $GITHUB_OUTPUT
            echo "message=Failed to download config" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          if [ ! -s all.txt ]; then
            echo "status=error" >> $GITHUB_OUTPUT
            echo "message=Config file is empty" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Get traffic stats
        id: traffic
        if: env.API_URL != ''
        run: |
          set -e
          API_URL="${{ secrets.API_URL }}"
          API_KEY="${{ secrets.API_KEY }}"
          
          if [ -z "$API_URL" ] || [ -z "$API_KEY" ]; then
            echo "upload=0" >> $GITHUB_OUTPUT
            echo "download=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if ! RESPONSE=$(curl -s --max-time 5 -H "Authorization: Bearer $API_KEY" "$API_URL" 2>/dev/null); then
            echo "upload=0" >> $GITHUB_OUTPUT
            echo "download=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          UPLOAD=$(echo "$RESPONSE" | jq -r '.upload // 0')
          DOWNLOAD=$(echo "$RESPONSE" | jq -r '.download // 0')
          TOTAL=$((UPLOAD + DOWNLOAD))
          
          echo "upload=$UPLOAD" >> $GITHUB_OUTPUT
          echo "download=$DOWNLOAD" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Extract and filter VLESS links
        id: extract
        run: |
          set -e
          
          # Extract and clean VLESS links
          tr -d '\r' < all.txt | \
            grep -aEo 'vless://[^[:space:]]+' | \
            awk '!seen[$0]++' > unique.txt
          
          if [ ! -s unique.txt ]; then
            echo "error=No VLESS links found" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          TOTAL_LINKS=$(wc -l < unique.txt)
          echo "total_links=$TOTAL_LINKS" >> $GITHUB_OUTPUT

      - name: Detect hysteria servers
        id: hysteria
        run: |
          set -e
          
          # More robust hysteria detection
          > hysteria_servers.txt
          
          # Method 1: Check host/sni parameters
          grep -E '(host|sni)=([^&]+)' unique.txt | while IFS= read -r link; do
            if [[ $link =~ (host|sni)=([^&]+) ]]; then
              VALUE="${BASH_REMATCH[2]}"
              # URL decode and check for hysteria
              DECODED=$(printf '%b' "${VALUE//%/\\x}" 2>/dev/null || echo "$VALUE")
              if echo "$DECODED" | grep -qi "hysteria"; then
                echo "$link" >> hysteria_servers.txt
              fi
            fi
          done
          
          # Method 2: Check for .hysteria. in URL
          if [ ! -s hysteria_servers.txt ]; then
            grep -i "\.hysteria\." unique.txt > hysteria_servers.txt || true
          fi
          
          # Method 3: Check for hysteria in any part
          if [ ! -s hysteria_servers.txt ]; then
            grep -i "hysteria" unique.txt > hysteria_servers.txt || true
          fi
          
          # If no hysteria, use all links
          if [ ! -s hysteria_servers.txt ]; then
            cp unique.txt hysteria_servers.txt
            echo "warning=No hysteria found, using all" >> $GITHUB_OUTPUT
          fi
          
          HYSTERIA_COUNT=$(wc -l < hysteria_servers.txt)
          echo "hysteria_count=$HYSTERIA_COUNT" >> $GITHUB_OUTPUT

      - name: Check server availability
        id: check
        run: |
          set -e
          
          # Function to check server
          check_server() {
            local link="$1"
            local host port
            
            # Extract host and port
            if [[ $link =~ vless://[^@]+@([^:]+):([0-9]+) ]]; then
              host="${BASH_REMATCH[1]}"
              port="${BASH_REMATCH[2]}"
            else
              host=$(echo "$link" | grep -oE '://[^/]+' | sed 's/:\/\///' | cut -d':' -f1)
              port=$(echo "$link" | grep -oE '://[^/]+' | sed 's/:\/\///' | cut -d':' -f2 | cut -d'/' -f1)
              [ -z "$port" ] && port="443"
            fi
            
            # Quick port check
            if timeout 2 nc -zv "$host" "$port" 2>&1 | grep -q "Connected"; then
              # Get country
              country=$(curl -s --max-time 2 "http://ip-api.com/line/$host?fields=countryCode" 2>/dev/null || echo "UNKNOWN")
              echo "$link|$country"
            fi
          }
          
          export -f check_server
          
          # Check first 100 servers in parallel
          head -100 hysteria_servers.txt | \
            parallel -j ${{ env.PARALLEL_CHECKS }} check_server {} > server_status.txt || true
          
          # Parse results
          grep -E '\|RU$' server_status.txt | cut -d'|' -f1 > working_russia.txt || true
          grep -E '\|(US|DE|FR|GB|NL|CA|AU|SG|JP|KR)$' server_status.txt | cut -d'|' -f1 > working_other.txt || true
          
          RUSSIA_COUNT=$(wc -l < working_russia.txt 2>/dev/null || echo 0)
          OTHER_COUNT=$(wc -l < working_other.txt 2>/dev/null || echo 0)
          
          echo "russia_count=$RUSSIA_COUNT" >> $GITHUB_OUTPUT
          echo "other_count=$OTHER_COUNT" >> $GITHUB_OUTPUT

      - name: Select best servers
        id: select
        run: |
          set -e
          
          > selected.txt
          
          # Select Russia servers
          if [ -s working_russia.txt ]; then
            head -${{ env.RUSSIA_SERVERS }} working_russia.txt >> selected.txt
          fi
          
          # Select other servers
          if [ -s working_other.txt ]; then
            head -${{ env.OTHER_SERVERS }} working_other.txt >> selected.txt
          fi
          
          # Fallback to non-checked servers if needed
          SELECTED_COUNT=$(wc -l < selected.txt 2>/dev/null || echo 0)
          NEEDED=$(( ${{ env.MAX_SERVERS }} - SELECTED_COUNT ))
          
          if [ "$NEEDED" -gt 0 ] && [ -s hysteria_servers.txt ]; then
            # Get servers not already selected
            grep -Fvxf selected.txt hysteria_servers.txt | head -"$NEEDED" >> selected.txt
          fi
          
          # Final cleanup and limit
          sed -i '/^$/d' selected.txt
          head -${{ env.MAX_SERVERS }} selected.txt > temp.txt
          mv temp.txt selected.txt
          
          FINAL_COUNT=$(wc -l < selected.txt)
          echo "final_count=$FINAL_COUNT" >> $GITHUB_OUTPUT

      - name: Generate output files
        id: generate
        run: |
          set -e
          export TZ=Europe/Moscow
          
          # Get traffic stats
          UPLOAD="${{ steps.traffic.outputs.upload || 0 }}"
          DOWNLOAD="${{ steps.traffic.outputs.download || 0 }}"
          TOTAL="${{ steps.traffic.outputs.total || 0 }}"
          
          # Get counts
          FINAL_COUNT="${{ steps.select.outputs.final_count || 0 }}"
          HYSTERIA_COUNT="${{ steps.hysteria.outputs.hysteria_count || 0 }}"
          RUSSIA_COUNT="${{ steps.check.outputs.russia_count || 0 }}"
          OTHER_COUNT="${{ steps.check.outputs.other_count || 0 }}"
          
          # Calculate actual used
          RUSSIA_USED=$(grep -Ff working_russia.txt selected.txt 2>/dev/null | wc -l || echo 0)
          OTHER_USED=$(grep -Ff working_other.txt selected.txt 2>/dev/null | wc -l || echo 0)
          
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          
          # Generate white-list.txt
          {
            echo "# profile-title: @meowmeres 🏳️HYSTERIA LISTS🏳️"
            echo "# profile-update-interval: 1"
            echo "# subscription-userinfo: upload=$UPLOAD; download=$DOWNLOAD; total=$TOTAL; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $FINAL_COUNT"
            echo "# Hysteria servers: $HYSTERIA_COUNT total"
            echo "# Russia: $RUSSIA_USED (of $RUSSIA_COUNT) | Other: $OTHER_USED (of $OTHER_COUNT)"
            echo ""
            
            COUNT=1
            while IFS= read -r link; do
              echo "📱LTE Обход #$COUNT"
              echo "$link"
              ((COUNT++))
            done < selected.txt
          } > public/white-list.txt
          
          # Generate android.txt (just links)
          cat selected.txt > public/android.txt
          
          # Generate index.html
          cat > public/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=white-list.txt">
            <title>Hysteria Lists</title>
          </head>
          <body>
            <h1>✅ Updated: $DATE $TIME</h1>
            <p>Hysteria: RU $RUSSIA_USED, Other $OTHER_USED</p>
            <p>Total servers: $FINAL_COUNT</p>
            <a href="white-list.txt">Download subscription</a>
          </body>
          </html>
          EOF
          
          # Create a metadata file for debugging
          cat > public/meta.json << EOF
          {
            "update": "$DATE $TIME",
            "total_servers": $FINAL_COUNT,
            "hysteria_total": $HYSTERIA_COUNT,
            "russia_working": $RUSSIA_COUNT,
            "other_working": $OTHER_COUNT,
            "russia_used": $RUSSIA_USED,
            "other_used": $OTHER_USED,
            "upload": $UPLOAD,
            "download": $DOWNLOAD,
            "total": $TOTAL
          }
          EOF
          
          echo "Generated files successfully"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Debug output
        if: failure()
        run: |
          echo "=== Debug Info ==="
          ls -la public/ || true
          echo "=== selected.txt ==="
          cat selected.txt 2>/dev/null || echo "File not found"
          echo "=== working_russia.txt ==="
          cat working_russia.txt 2>/dev/null || echo "File not found"
          echo "=== working_other.txt ==="
          cat working_other.txt 2>/dev/null || echo "File not found"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
