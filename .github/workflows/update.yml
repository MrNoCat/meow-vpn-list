name: "@meowmeres 🏳️WHITE LISTS🏳️"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download configs
        run: |
          set -e
          mkdir -p public
          curl -fLsS https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt -o all.txt || echo "" > all.txt

      - name: Build fast servers list
        run: |
          set -e
          export TZ=Europe/Moscow

          LOCATIONS="Frankfurt Finland Italy Netherlands"
          PROTOCOLS="tcp xhttp grpc"

          for LOC in $LOCATIONS; do
            for PROTO in $PROTOCOLS; do
              grep -i "$LOC" all.txt | grep -i "$PROTO" | head -n 1 > "${LOC}_${PROTO}.tmp" || echo "" > "${LOC}_${PROTO}.tmp"
            done
          done

          # Берём первые попавшиеся для каждого протокола (по приоритету локаций)
          TCP=$(cat Frankfurt_tcp.tmp Finland_tcp.tmp Italy_tcp.tmp Netherlands_tcp.tmp 2>/dev/null | head -n 1 | tr -d '\r' | grep -aEo 'vless://[^[:space:]]+' || echo "")
          XHTTP=$(cat Frankfurt_xhttp.tmp Finland_xhttp.tmp Italy_xhttp.tmp Netherlands_xhttp.tmp 2>/dev/null | head -n 1 | tr -d '\r' | grep -aEo 'vless://[^[:space:]]+' || echo "")
          GRPC=$(cat Frankfurt_grpc.tmp Finland_grpc.tmp Italy_grpc.tmp Netherlands_grpc.tmp 2>/dev/null | head -n 1 | tr -d '\r' | grep -aEo 'vless://[^[:space:]]+' || echo "")

          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")

          {
            echo "# profile-title: 🚀 MeowMere VPN TCP"
            echo "# profile-update-interval: 12"
            echo "# subscription-userinfo: upload=0; download=0; total=0; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: 1"
            echo ""
            echo "$TCP"
          } > public/tcp.txt

          {
            echo "# profile-title: 🚀 MeowMere VPN XHTTP"
            echo "# profile-update-interval: 12"
            echo "# subscription-userinfo: upload=0; download=0; total=0; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: 1"
            echo ""
            echo "$XHTTP"
          } > public/xhttp.txt

          {
            echo "# profile-title: 🚀 MeowMere VPN gRPC"
            echo "# profile-update-interval: 12"
            echo "# subscription-userinfo: upload=0; download=0; total=0; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: 1"
            echo ""
            echo "$GRPC"
          } > public/grpc.txt

          echo "OK" > public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
