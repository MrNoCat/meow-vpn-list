name: "@meowmeres 🏳️WHITE LISTS🏳️"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download config
        run: |
          curl -fLsS --connect-timeout 10 --max-time 30 \
            https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt \
            -o all.txt || echo "" > all.txt

      - name: Get traffic stats (optional)
        if: env.API_URL != ''
        run: |
          set -e
          API_URL="${{ secrets.API_URL }}"
          API_KEY="${{ secrets.API_KEY }}"
          if [ -z "$API_URL" ]; then
            echo "UPLOAD=0" >> $GITHUB_ENV
            echo "DOWNLOAD=0" >> $GITHUB_ENV
            echo "TOTAL=0" >> $GITHUB_ENV
            exit 0
          fi
          RESPONSE=$(curl -s --max-time 5 -H "Authorization: Bearer $API_KEY" "$API_URL" || echo "{}")
          UPLOAD=$(echo "$RESPONSE" | jq -r '.upload // 0')
          DOWNLOAD=$(echo "$RESPONSE" | jq -r '.download // 0')
          TOTAL=$((UPLOAD + DOWNLOAD))
          echo "UPLOAD=$UPLOAD" >> $GITHUB_ENV
          echo "DOWNLOAD=$DOWNLOAD" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Build list with geo filtering
        run: |
          set -e
          export TZ=Europe/Moscow
          mkdir -p public
          
          if [ ! -s all.txt ]; then
            echo "NO DATA" > public/white-list.txt
            echo "NO DATA" > public/android.txt
            echo "NO DATA" > public/index.html
            exit 0
          fi
          
          # Extract links
          tr -d '\r' < all.txt | grep -aEo '(vless|trojan|ss)://[^[:space:]]+' > links.txt || true
          
          if [ ! -s links.txt ]; then
            echo "NO LINKS FOUND" > public/white-list.txt
            echo "NO LINKS FOUND" > public/android.txt
            echo "NO LINKS FOUND" > public/index.html
            exit 0
          fi
          
          # Remove duplicates
          awk '!seen[$0]++' links.txt > unique.txt
          
          # Create separate lists for Russia and other countries
          > russia_servers.txt
          > other_servers.txt
          
          # Process each server and detect country by IP
          while IFS= read -r link; do
            # Extract host from link
            if [[ $link =~ vless://([^@]+)@([^:]+):([0-9]+) ]]; then
              HOST="${BASH_REMATCH[2]}"
            else
              HOST=$(echo "$link" | grep -oE '://[^/]+' | sed 's/:\/\///' | cut -d':' -f1)
            fi
            
            # Get country using ip-api.com (fast, free, no API key needed)
            COUNTRY=$(curl -s --max-time 2 "http://ip-api.com/line/$HOST?fields=countryCode" 2>/dev/null || echo "UNKNOWN")
            
            # Check if Russia
            if [[ "$COUNTRY" == "RU" ]]; then
              echo "$link" >> russia_servers.txt
            else
              echo "$link" >> other_servers.txt
            fi
          done < unique.txt
          
          # Take 3 from Russia and 2 from other countries
          > selected.txt
          head -3 russia_servers.txt >> selected.txt
          head -2 other_servers.txt >> selected.txt
          
          # If not enough Russia servers, take more from other countries
          RUSSIA_COUNT=$(wc -l < russia_servers.txt)
          OTHER_COUNT=$(wc -l < other_servers.txt)
          
          if [ "$RUSSIA_COUNT" -lt 3 ]; then
            # Need more from other countries
            NEEDED=$((5 - RUSSIA_COUNT))
            if [ "$OTHER_COUNT" -ge "$NEEDED" ]; then
              head -$NEEDED other_servers.txt > temp.txt
              cat russia_servers.txt > selected.txt
              cat temp.txt >> selected.txt
            else
              cat russia_servers.txt > selected.txt
              head -$((5 - RUSSIA_COUNT)) other_servers.txt >> selected.txt
            fi
          fi
          
          # If no servers at all, use first 5 from unique
          if [ ! -s selected.txt ]; then
            head -5 unique.txt > selected.txt
          fi
          
          # Remove empty lines
          sed -i '/^$/d' selected.txt
          
          # Add names
          COUNT=1
          > final_with_names.txt
          while IFS= read -r link; do
            echo "📱LTE Обход #$COUNT" >> final_with_names.txt
            echo "$link" >> final_with_names.txt
            ((COUNT++))
          done < selected.txt
          
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT_LINES=$(wc -l < final_with_names.txt | xargs)
          UPLOAD=${UPLOAD:-0}
          DOWNLOAD=${DOWNLOAD:-0}
          TOTAL=${TOTAL:-0}
          
          {
            echo "# profile-title: @meowmeres 🏳️WHITE LISTS🏳️"
            echo "# profile-update-interval: 1"
            echo "# subscription-userinfo: upload=$UPLOAD; download=$DOWNLOAD; total=$TOTAL; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT_LINES"
            echo ""
            cat final_with_names.txt
          } > public/white-list.txt
          
          cat selected.txt > public/android.txt
          echo "✅ Updated: $DATE $TIME" > public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
