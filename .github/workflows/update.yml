name: "@meowmeres 🏳️HYSTERIA LISTS🏳️"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download config
        run: |
          curl -fLsS --connect-timeout 10 --max-time 30 \
            https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt \
            -o all.txt || echo "" > all.txt

      - name: Get traffic stats (optional)
        if: env.API_URL != ''
        run: |
          set -e
          API_URL="${{ secrets.API_URL }}"
          API_KEY="${{ secrets.API_KEY }}"
          if [ -z "$API_URL" ]; then
            echo "UPLOAD=0" >> $GITHUB_ENV
            echo "DOWNLOAD=0" >> $GITHUB_ENV
            echo "TOTAL=0" >> $GITHUB_ENV
            exit 0
          fi
          RESPONSE=$(curl -s --max-time 5 -H "Authorization: Bearer $API_KEY" "$API_URL" || echo "{}")
          UPLOAD=$(echo "$RESPONSE" | jq -r '.upload // 0')
          DOWNLOAD=$(echo "$RESPONSE" | jq -r '.download // 0')
          TOTAL=$((UPLOAD + DOWNLOAD))
          echo "UPLOAD=$UPLOAD" >> $GITHUB_ENV
          echo "DOWNLOAD=$DOWNLOAD" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Build list with hysteria servers only
        run: |
          set -e
          export TZ=Europe/Moscow
          mkdir -p public
          
          if [ ! -s all.txt ]; then
            echo "NO DATA" > public/white-list.txt
            echo "NO DATA" > public/android.txt
            echo "NO DATA" > public/index.html
            exit 0
          fi
          
          # Extract vless links
          tr -d '\r' < all.txt | grep -aEo 'vless://[^[:space:]]+' > links.txt || true
          
          if [ ! -s links.txt ]; then
            echo "NO VLESS LINKS FOUND" > public/white-list.txt
            echo "NO VLESS LINKS FOUND" > public/android.txt
            echo "NO VLESS LINKS FOUND" > public/index.html
            exit 0
          fi
          
          # Remove duplicates
          awk '!seen[$0]++' links.txt > unique.txt
          
          # Filter only hysteria servers
          echo "Filtering hysteria servers..."
          > hysteria_servers.txt
          
          while IFS= read -r link; do
            # Check if link contains hysteria in host or sni
            if [[ $link =~ (host|sni)=([^&]+) ]]; then
              VALUE="${BASH_REMATCH[2]}"
              # URL decode the value
              DECODED=$(echo "$VALUE" | sed 's/%/\\x/g' | xargs -0 printf "%b" 2>/dev/null || echo "$VALUE")
              if echo "$DECODED" | grep -qi "hysteria"; then
                echo "$link" >> hysteria_servers.txt
              fi
            fi
          done < unique.txt
          
          # If no hysteria servers found, try alternative method
          if [ ! -s hysteria_servers.txt ]; then
            echo "No hysteria servers found with host/sni, trying alternative detection..."
            grep -i "hysteria" unique.txt > hysteria_servers.txt || true
          fi
          
          # If still no servers, try looking for .hysteria. in URL
          if [ ! -s hysteria_servers.txt ]; then
            echo "Trying to find .hysteria. in links..."
            grep -i "\.hysteria\." unique.txt > hysteria_servers.txt || true
          fi
          
          # If no hysteria servers at all, use any vless servers
          if [ ! -s hysteria_servers.txt ]; then
            echo "No hysteria servers found, using all vless servers"
            cp unique.txt hysteria_servers.txt
          fi
          
          HYSTERIA_COUNT=$(wc -l < hysteria_servers.txt)
          echo "Found $HYSTERIA_COUNT hysteria servers"
          
          # Test if servers are working (check port open)
          echo "Testing server availability..."
          > working_russia.txt
          > working_other.txt
          
          # Test first 50 hysteria servers
          head -50 hysteria_servers.txt > test_servers.txt
          
          while IFS= read -r link; do
            # Extract host and port
            if [[ $link =~ vless://[^@]+@([^:]+):([0-9]+) ]]; then
              HOST="${BASH_REMATCH[1]}"
              PORT="${BASH_REMATCH[2]}"
            else
              HOST=$(echo "$link" | grep -oE '://[^/]+' | sed 's/:\/\///' | cut -d':' -f1)
              PORT=$(echo "$link" | grep -oE '://[^/]+' | sed 's/:\/\///' | cut -d':' -f2 | cut -d'/' -f1)
              [ -z "$PORT" ] && PORT="443"
            fi
            
            # Check if port is open
            if timeout 2 nc -zv "$HOST" "$PORT" 2>&1 | grep -q "Connected"; then
              # Server is working, check country
              COUNTRY=$(curl -s --max-time 2 "http://ip-api.com/line/$HOST?fields=countryCode" 2>/dev/null || echo "UNKNOWN")
              if [[ "$COUNTRY" == "RU" ]]; then
                echo "$link" >> working_russia.txt
              else
                echo "$link" >> working_other.txt
              fi
            fi
          done < test_servers.txt
          
          # Select 3 from Russia and 2 from other countries
          > selected.txt
          
          RUSSIA_COUNT=$(wc -l < working_russia.txt)
          OTHER_COUNT=$(wc -l < working_other.txt)
          
          echo "Working hysteria Russia servers: $RUSSIA_COUNT"
          echo "Working hysteria other servers: $OTHER_COUNT"
          
          # Select servers
          if [ "$RUSSIA_COUNT" -ge 3 ]; then
            head -3 working_russia.txt >> selected.txt
          else
            cat working_russia.txt >> selected.txt
          fi
          
          if [ "$OTHER_COUNT" -ge 2 ]; then
            head -2 working_other.txt >> selected.txt
          else
            cat working_other.txt >> selected.txt
          fi
          
          # If not enough servers, try more from hysteria list
          SELECTED_COUNT=$(wc -l < selected.txt)
          if [ "$SELECTED_COUNT" -lt 5 ]; then
            echo "Not enough working hysteria servers, trying more..."
            tail -n +51 hysteria_servers.txt | head -50 | while IFS= read -r link; do
              if [[ $link =~ vless://[^@]+@([^:]+):([0-9]+) ]]; then
                HOST="${BASH_REMATCH[1]}"
                PORT="${BASH_REMATCH[2]}"
              else
                HOST=$(echo "$link" | grep -oE '://[^/]+' | sed 's/:\/\///' | cut -d':' -f1)
                PORT=$(echo "$link" | grep -oE '://[^/]+' | sed 's/:\/\///' | cut -d':' -f2 | cut -d'/' -f1)
                [ -z "$PORT" ] && PORT="443"
              fi
              
              if timeout 2 nc -zv "$HOST" "$PORT" 2>&1 | grep -q "Connected"; then
                echo "$link" >> selected.txt
                SELECTED_COUNT=$((SELECTED_COUNT + 1))
                if [ "$SELECTED_COUNT" -ge 5 ]; then
                  break
                fi
              fi
            done
          fi
          
          # If still no servers, use first 5 hysteria servers without checking
          if [ ! -s selected.txt ]; then
            echo "No working hysteria servers found, using first 5 hysteria servers"
            head -5 hysteria_servers.txt > selected.txt
          fi
          
          # Remove empty lines and limit to 5
          sed -i '/^$/d' selected.txt
          head -5 selected.txt > temp.txt
          mv temp.txt selected.txt
          
          # Add names
          COUNT=1
          > final_with_names.txt
          while IFS= read -r link; do
            echo "📱LTE Обход #$COUNT" >> final_with_names.txt
            echo "$link" >> final_with_names.txt
            ((COUNT++))
          done < selected.txt
          
          # Add server info
          RUSSIA_FINAL=$(grep -Ff working_russia.txt selected.txt | wc -l || echo 0)
          OTHER_FINAL=$(grep -Ff working_other.txt selected.txt | wc -l || echo 0)
          
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT_LINES=$(wc -l < final_with_names.txt | xargs)
          UPLOAD=${UPLOAD:-0}
          DOWNLOAD=${DOWNLOAD:-0}
          TOTAL=${TOTAL:-0}
          
          {
            echo "# profile-title: @meowmeres 🏳️HYSTERIA LISTS🏳️"
            echo "# profile-update-interval: 1"
            echo "# subscription-userinfo: upload=$UPLOAD; download=$DOWNLOAD; total=$TOTAL; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT_LINES"
            echo "# Hysteria servers: $HYSTERIA_COUNT total"
            echo "# Russia: $RUSSIA_FINAL | Other: $OTHER_FINAL"
            echo ""
            cat final_with_names.txt
          } > public/white-list.txt
          
          cat selected.txt > public/android.txt
          echo "✅ Updated: $DATE $TIME (Hysteria: RU $RUSSIA_FINAL, Other $OTHER_FINAL)" > public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
