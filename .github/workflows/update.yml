name: "📱LTE Обход"

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download config
        run: |
          set -e
          curl -fLsS --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt \
            -o all.txt

      - name: Get traffic stats
        run: |
          set -e
          API_URL="${{ secrets.API_URL }}"
          API_KEY="${{ secrets.API_KEY }}"
          if [ -z "$API_URL" ] || [ -z "$API_KEY" ]; then
            echo "UPLOAD=0" >> $GITHUB_ENV
            echo "DOWNLOAD=0" >> $GITHUB_ENV
            echo "TOTAL=0" >> $GITHUB_ENV
            exit 0
          fi
          RESPONSE=$(curl -s -H "Authorization: Bearer $API_KEY" "$API_URL")
          UPLOAD=$(echo "$RESPONSE" | jq '.upload // 0' | sed 's/null/0/g')
          DOWNLOAD=$(echo "$RESPONSE" | jq '.download // 0' | sed 's/null/0/g')
          TOTAL=$((UPLOAD + DOWNLOAD))
          echo "UPLOAD=$UPLOAD" >> $GITHUB_ENV
          echo "DOWNLOAD=$DOWNLOAD" >> $GITHUB_ENV
          echo "TOTAL=$TOTAL" >> $GITHUB_ENV

      - name: Build list with speed test
        run: |
          set -e
          export TZ=Europe/Moscow
          mkdir -p public
          
          if [ ! -s all.txt ]; then
            echo "NO DATA" > public/white-list.txt
            exit 0
          fi
          
          tr -d '\r' < all.txt > fixed.txt
          
          # Сначала вытаскиваем hysteria (приоритет)
          grep -aEo 'hysteria://[^[:space:]]+' fixed.txt > hysteria_links.txt || true
          
          # Потом vless и trojan (запасные)
          grep -aEo '(vless|trojan)://[^[:space:]]+' fixed.txt > other_links.txt || true
          
          # Объединяем: сначала hysteria, потом остальные
          cat hysteria_links.txt other_links.txt > all_links.txt
          
          if [ ! -s all_links.txt ]; then
            echo "NO LINKS" > public/white-list.txt
            exit 0
          fi
          
          awk '!seen[$0]++' all_links.txt > unique.txt
          
          # Тестируем скорость каждого сервера
          > speed_results.txt
          while IFS= read -r line; do
            # Извлекаем хост из ссылки
            HOST=$(echo "$line" | sed -E 's|(hysteria|vless|trojan)://([^:/]+).*|\2|')
            if [ -n "$HOST" ]; then
              PING=$(ping -c 2 -W 2 "$HOST" 2>/dev/null | grep -oP 'avg = \K[0-9.]+' | head -1)
              if [ -z "$PING" ]; then
                PING=9999
              fi
              # Добавляем приоритет: hysteria получает бонус -100 к пингу (всегда вперёд)
              if [[ "$line" == hysteria://* ]]; then
                PRIORITY=$((PING - 100))
              else
                PRIORITY=$PING
              fi
              echo "$PRIORITY|$PING|$line" >> speed_results.txt
            fi
          done < unique.txt
          
          # Сортируем по приоритету (hysteria всегда выше)
          sort -n speed_results.txt | head -n 5 | cut -d'|' -f3 > final.txt
          
          DATE=$(date +"%d.%m.%Y")
          TIME=$(date +"%H:%M")
          COUNT=$(wc -l < final.txt)
          UPLOAD=${UPLOAD:-0}
          DOWNLOAD=${DOWNLOAD:-0}
          TOTAL=${TOTAL:-0}
          
          {
            echo "# profile-title: 📱LTE Обход"
            echo "# profile-update-interval: 1"
            echo "# subscription-userinfo: upload=$UPLOAD; download=$DOWNLOAD; total=$TOTAL; expire=0"
            echo "# update: $DATE $TIME (MSK)"
            echo "# servers: $COUNT"
            echo ""
          } > public/white-list.txt
          
          i=1
          while IFS= read -r line; do
            if [ $i -le 5 ]; then
              echo "$line" >> public/white-list.txt
              echo "# 📱LTE Обход #$i" >> public/white-list.txt
            fi
            i=$((i+1))
          done < final.txt
          
          cp final.txt public/android.txt
          echo "OK" > public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
